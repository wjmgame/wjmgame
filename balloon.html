<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#8fd3f4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>ふうせん</title>
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #8fd3f4;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    overscroll-behavior: none; -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; width: 100%; height: 100%; }
  /* 保護者用: 右上を1.5秒長押しでトップへ戻る */
  #gate {
    position: fixed; top: env(safe-area-inset-top, 0px); right: env(safe-area-inset-right, 0px);
    width: 56px; height: 56px; z-index: 10; background: transparent; border: 0; opacity: 0;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="gate" aria-label="トップへ戻る（長押し）"></button>

<script>
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const COLORS = ["#ff7a6b", "#ffc83d", "#4ccb8a", "#8e7cff", "#ff8fc7", "#3db5ff"];
const SCALE = [523.25, 587.33, 659.25, 783.99, 880.0, 1046.5];
const rand = (a, b) => a + Math.random() * (b - a);

let W, H, DPR, R;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  R = Math.max(46, Math.min(W, H) * 0.13); // 2歳でも当てやすい大きさ
}
addEventListener("resize", resize);
resize();

// --- 音 ---
let muted = false;
try { muted = JSON.parse(localStorage.getItem("muted")) === true; } catch (e) {}
let ac = null, noiseBuf = null;
function audio() {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
  if (ac.state === "suspended") ac.resume();
  return ac;
}
function tone(a, freq, t, dur, vol) {
  const o = a.createOscillator(), g = a.createGain();
  o.type = "sine";
  o.frequency.setValueAtTime(freq, t);
  o.frequency.exponentialRampToValueAtTime(freq * 1.5, t + .12);
  g.gain.setValueAtTime(.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + .02);
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g).connect(a.destination);
  o.start(t); o.stop(t + dur + .02);
}
function popSound() {
  if (muted) return;
  const a = audio(); if (!a) return;
  const t = a.currentTime;
  if (!noiseBuf) {
    noiseBuf = a.createBuffer(1, Math.floor(a.sampleRate * .15), a.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let k = 0; k < d.length; k++) d[k] = (Math.random() * 2 - 1) * (1 - k / d.length);
  }
  const n = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  n.buffer = noiseBuf; f.type = "bandpass"; f.frequency.value = 1800;
  g.gain.setValueAtTime(.5, t); g.gain.exponentialRampToValueAtTime(.001, t + .12);
  n.connect(f).connect(g).connect(a.destination); n.start(t);
  tone(a, SCALE[Math.floor(Math.random() * SCALE.length)], t, .25, .18);
}
function blipSound() {
  if (muted) return;
  const a = audio(); if (!a) return;
  tone(a, SCALE[Math.floor(Math.random() * 3)] / 2, a.currentTime, .2, .1);
}

// --- ふうせん ---
const MAX = () => (W > H ? 20 : 15);
const balloons = [];
function spawn(initial) {
  const r = R * rand(.85, 1.15);
  return {
    x0: rand(r * 1.2, W - r * 1.2),
    y: initial ? rand(H * .15, H * 1.05) : H + r * 2.5 + rand(0, H * .35),
    r, color: COLORS[Math.floor(Math.random() * COLORS.length)],
    speed: rand(.07, .12) * H,           // 1秒あたりに上がる距離。ゆっくり
    phase: rand(0, 6.28), sway: rand(.8, 1.6), amp: r * rand(.15, .35),
  };
}
const bx = (b) => b.x0 + Math.sin(t * b.sway + b.phase) * b.amp;
function fill() { while (balloons.length < MAX()) balloons.push(spawn(true)); }

const parts = [];
function burst(x, y, color, n, power) {
  for (let i = 0; i < n; i++) {
    const ang = rand(0, 6.28), sp = rand(.4, 1) * power;
    parts.push({ x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 60, life: .7,
                 color: Math.random() < .6 ? color : "#ffffff", size: rand(4, 9) });
  }
}

// 雲
const clouds = [0, 1, 2].map((i) => ({ x: rand(0, 1) * 1000, y: 40 + i * 120 + rand(0, 40), s: rand(.8, 1.4), v: rand(8, 18) }));

// --- 入力（マルチタッチ対応）---
cv.addEventListener("pointerdown", (e) => {
  const x = e.clientX, y = e.clientY;
  let hit = -1, best = 1e9;
  balloons.forEach((b, i) => {
    const dx = (x - bx(b)) / (b.r * 1.3), dy = (y - b.y) / (b.r * 1.18 * 1.3);
    const d = dx * dx + dy * dy;
    if (d <= 1 && d < best) { best = d; hit = i; }
  });
  if (hit >= 0) {
    const b = balloons[hit];
    burst(bx(b), b.y, b.color, 16, 380);
    popSound();
    balloons[hit] = spawn(false);
  } else {
    burst(x, y, "#ffffff", 6, 160); // 何もないところでも必ず反応
    blipSound();
  }
});

// --- 描画 ---
function drawCloud(c) {
  ctx.fillStyle = "rgba(255,255,255,.7)";
  ctx.beginPath();
  [[0, 0, 60], [50, -12, 48], [-50, -8, 44], [10, -26, 40]].forEach(([dx, dy, r]) => {
    ctx.moveTo(c.x + dx * c.s + r * c.s, c.y + dy * c.s);
    ctx.arc(c.x + dx * c.s, c.y + dy * c.s, r * c.s, 0, 6.28);
  });
  ctx.fill();
}
function drawBalloon(b) {
  const x = bx(b), rx = b.r, ry = b.r * 1.18;
  ctx.strokeStyle = "rgba(35,48,90,.45)"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x, b.y + ry + 8);
  ctx.bezierCurveTo(x - 10, b.y + ry + 30, x + 10, b.y + ry + 50, x, b.y + ry + 75); ctx.stroke();
  ctx.fillStyle = b.color;
  ctx.beginPath(); ctx.moveTo(x, b.y + ry - 2); ctx.lineTo(x - 8, b.y + ry + 9); ctx.lineTo(x + 8, b.y + ry + 9); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x, b.y, rx, ry, 0, 0, 6.28); ctx.fill();
  const g = ctx.createRadialGradient(x - rx * .35, b.y - ry * .35, rx * .1, x, b.y, rx * 1.2);
  g.addColorStop(0, "rgba(255,255,255,.55)");
  g.addColorStop(.5, "rgba(255,255,255,0)");
  g.addColorStop(1, "rgba(35,48,90,.22)");
  ctx.fillStyle = g; ctx.fill();
}
function draw() {
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, "#b9e9fb"); bg.addColorStop(1, "#8fd3f4");
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  clouds.forEach(drawCloud);
  balloons.forEach(drawBalloon);
  parts.forEach((p) => {
    ctx.globalAlpha = Math.max(0, p.life / .7);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, 6.28); ctx.fill();
  });
  ctx.globalAlpha = 1;
}

// --- ループ ---
let t = 0, last = performance.now();
fill();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; t += dt;
  balloons.forEach((b, i) => {
    b.y -= b.speed * dt;
    if (b.y < -b.r * 3) balloons[i] = spawn(false); // 上に抜けたら下から再登場（失敗なし）
  });
  clouds.forEach((c) => { c.x += c.v * dt; if (c.x > W + 120) c.x = -120; });
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.life -= dt;
    if (p.life <= 0) { parts.splice(i, 1); continue; }
    p.vy += 600 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
  }
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// --- 保護者用ゲート ---
let hold = null;
const gate = document.getElementById("gate");
gate.addEventListener("pointerdown", (e) => { e.stopPropagation(); hold = setTimeout(() => { location.href = "../"; }, 1500); });
["pointerup", "pointerleave", "pointercancel"].forEach((ev) => gate.addEventListener(ev, () => clearTimeout(hold)));
document.addEventListener("contextmenu", (e) => e.preventDefault());
document.addEventListener("gesturestart", (e) => e.preventDefault());
</script>
</body>
</html>
