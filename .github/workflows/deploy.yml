name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: games.json と assets/*/list.json を生成
        run: python3 scripts/build.py

      - name: 公開するファイルの一覧(確認用)
        run: find . -path ./.git -prune -o -type f -print | sort

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: 公開結果の確認(確認用)
        run: |
          sleep 20
          for f in index.html shared/common.js shared/faces.js games.json $(jq -r '.games[].href' games.json) $(ls assets/*/list.json 2>/dev/null); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "${{ steps.deployment.outputs.page_url }}$f?t=$(date +%s)")
            echo "$f -> $code"
          done
