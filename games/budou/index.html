<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ブドウ落とし</title>
<meta name="game-title" content="ブドウ落とし">
<meta name="game-icon" content="🍇">
<meta name="game-color" content="#8e7cff">
<meta name="game-order" content="40">
<script src="../../shared/common.js"></script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #8fd3f4; }
  canvas {
    position: fixed; inset: 0; width: 100%; height: 100%; display: block;
    touch-action: none; -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  // ---- 配色(shared/theme.css と同じ値) ----
  var SKY = '#8fd3f4', SUN = '#ffc83d', LEAF = '#4ccb8a', GRAPE = '#8e7cff';
  var LEAF_DARK = '#2fa56c', BROWN = '#8a5a2b';

  // ---- 共通機能への薄い橋渡し(音は common.js に任せる) ----
  function url(p) {
    return (window.Asobo && Asobo.url) ? Asobo.url(p) : '../../' + p;
  }
  function snd(fn) { try { fn(); } catch (e) {} }
  function scaleNote(i) {
    var sc = window.Asobo && Asobo.SCALE;
    if (sc && typeof sc[0] === 'number') return sc[i % sc.length];
    return [523, 587, 659, 784, 880][i % 5];
  }

  // ---- 画像 ----
  function loadImg(path) {
    var im = new Image();
    im.ok = false;
    im.onload = function () { im.ok = true; };
    im.src = url(path);
    return im;
  }
  var imgHang = loadImg('assets/icons/apple1.png');   // 木になっているブドウ
  var imgFall = loadImg('assets/icons/apple2.png');   // 落下中・カゴの中のブドウ

  // ---- 画面 ----
  var cv = document.getElementById('c');
  var cx = cv.getContext('2d');
  var W = 0, H = 0;
  var S, BW, BH, BY, GROUND, LEAFB;   // ブドウの高さ / カゴの幅・高さ・上端 / 地面 / 葉の下端
  var bx = window.innerWidth / 2, tx = bx;      // カゴの現在位置・目標位置

  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    cx.setTransform(dpr, 0, 0, dpr, 0, 0);
    S = Math.min(W * 0.2, H * 0.12);
    BW = Math.max(110, Math.min(W * 0.3, 220));
    BH = BW * 0.55;
    GROUND = H * 0.9;
    BY = GROUND - BH * 0.9;
    LEAFB = H * 0.085;
    tx = clamp(tx, BW / 2, W - BW / 2);
    bx = clamp(bx, BW / 2, W - BW / 2);
  }

  // ---- 状態 ----
  var t = 0;
  var stock = 0, fullTimer = 0, bump = 0;       // カゴの中の数・演出
  var regrowTimer = 0;
  var sparks = [];

  // 木のブドウの位置(画面に対する割合)
  var SLOTS = [
    [0.16, 0.19], [0.38, 0.19], [0.62, 0.19], [0.84, 0.19],
    [0.27, 0.33], [0.50, 0.33], [0.73, 0.33]
  ];
  var grapes = SLOTS.map(function (p, i) {
    return { i: i, fx: p[0], fy: p[1], state: 'hang', grow: 1, delay: 0, x: 0, y: 0, vy: 0, fade: 0 };
  });

  function gw() {  // ブドウの横幅(縦横比を反映)
    return imgFall.ok ? S * imgFall.width / imgFall.height : S * 0.8;
  }

  // ---- 操作 ----
  var down = {};
  function handle(x, y, isDown) {
    if (y >= H / 2) {
      tx = clamp(x, BW / 2, W - BW / 2);       // 下半分: カゴが移動
    } else if (isDown) {
      dropNearest(x, y);                       // 上半分: いちばん近いブドウが落ちる
    }
  }
  function dropNearest(x, y) {
    var best = null, bd = Infinity;
    grapes.forEach(function (g) {
      if (g.state !== 'hang' || g.delay > 0 || g.grow < 0.3) return;
      var dx = g.fx * W - x, dy = g.fy * H - y, d = dx * dx + dy * dy;
      if (d < bd) { bd = d; best = g; }
    });
    if (!best) return;
    best.state = 'fall';
    best.x = best.fx * W; best.y = best.fy * H; best.vy = H * 0.04;
    snd(function () { Asobo.blip(best.i); });
  }
  cv.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    down[e.pointerId] = true;
    handle(e.clientX, e.clientY, true);
  });
  cv.addEventListener('pointermove', function (e) {
    if (down[e.pointerId]) handle(e.clientX, e.clientY, false);
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (n) {
    cv.addEventListener(n, function (e) { delete down[e.pointerId]; });
  });

  // ---- きらきら ----
  function burst(x, y, n, big) {
    for (var k = 0; k < n; k++) {
      var a = Math.random() * Math.PI * 2, sp = (big ? 220 : 120) * (0.4 + Math.random());
      sparks.push({
        x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 80,
        life: 0.6 + Math.random() * 0.3, age: 0,
        r: 3 + Math.random() * 4,
        col: [SUN, GRAPE, LEAF, '#ff7a6b'][k % 4]
      });
    }
  }

  // ---- 更新 ----
  function update(dt) {
    t += dt;
    bx += (tx - bx) * (1 - Math.exp(-dt * 14));
    bump = Math.max(0, bump - dt * 5);

    var G = H * 1.3, allGone = true;
    grapes.forEach(function (g) {
      if (g.state === 'hang') {
        allGone = false;
        if (g.delay > 0) g.delay -= dt;
        else if (g.grow < 1) g.grow = Math.min(1, g.grow + dt / 0.5);
      } else if (g.state === 'fall') {
        allGone = false;
        var prev = g.y + S / 2;
        g.vy += G * dt; g.y += g.vy * dt;
        var bottom = g.y + S / 2;
        if (prev <= BY && bottom >= BY && Math.abs(g.x - bx) <= BW / 2 + gw() * 0.15) {
          g.state = 'gone';                      // カゴで受け止めた
          burst(g.x, BY, 8, false);
          bump = 1; stock++;
          snd(function () { Asobo.pop(); });
          if (stock >= 10 && fullTimer <= 0) {
            fullTimer = 0.8;
            burst(bx, BY - BW * 0.4, 24, true);
            for (var n = 0; n < 5; n++) (function (n) {
              setTimeout(function () { snd(function () { Asobo.tone(scaleNote(n), 0.18, 0.2, 1); }); }, n * 110);
            })(n);
          }
        } else if (bottom >= GROUND) {
          g.state = 'miss'; g.y = GROUND - S / 2; g.fade = 0;   // 地面で静かに消える
        }
      } else if (g.state === 'miss') {
        allGone = false;
        g.fade += dt / 0.5;
        if (g.fade >= 1) g.state = 'gone';
      }
    });

    if (fullTimer > 0) {
      fullTimer -= dt;
      if (fullTimer <= 0) stock = 0;
    }

    // 全部落としたら、まとめて実り直す
    if (allGone) {
      regrowTimer += dt;
      if (regrowTimer > 0.9) {
        regrowTimer = 0;
        grapes.forEach(function (g, i) { g.state = 'hang'; g.grow = 0; g.delay = i * 0.08; });
        snd(function () { Asobo.tone(scaleNote(0), 0.15, 0.15, 1); });
      }
    } else {
      regrowTimer = 0;
    }

    for (var k = sparks.length - 1; k >= 0; k--) {
      var p = sparks[k];
      p.age += dt;
      if (p.age >= p.life) { sparks.splice(k, 1); continue; }
      p.vy += 500 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    }
  }

  // ---- 描画 ----
  function ease(x) {
    if (x <= 0) return 0;
    var c1 = 1.70158, c3 = c1 + 1;
    return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
  }
  function circle(x, y, r, col) {
    cx.fillStyle = col; cx.beginPath(); cx.arc(x, y, r, 0, Math.PI * 2); cx.fill();
  }
  function drawGrape(img, x, y, h) {
    if (img.ok) {
      var w = h * img.width / img.height;
      cx.drawImage(img, x - w / 2, y - h / 2, w, h);
    } else {
      circle(x, y, h * 0.4, GRAPE);
      circle(x - h * 0.12, y - h * 0.12, h * 0.1, 'rgba(255,255,255,.5)');
    }
  }

  function drawBackground() {
    var g = cx.createLinearGradient(0, 0, 0, GROUND);
    g.addColorStop(0, SKY); g.addColorStop(1, '#e4f6ff');
    cx.fillStyle = g; cx.fillRect(0, 0, W, H);
    // くも
    cx.fillStyle = 'rgba(255,255,255,.85)';
    [[0.2, 0.58, 0.12], [0.78, 0.64, 0.09]].forEach(function (c) {
      var r = W * c[2], x = W * c[0], y = H * c[1];
      cx.beginPath();
      cx.ellipse(x, y, r, r * 0.4, 0, 0, Math.PI * 2);
      cx.ellipse(x + r * 0.5, y - r * 0.18, r * 0.6, r * 0.38, 0, 0, Math.PI * 2);
      cx.ellipse(x - r * 0.5, y - r * 0.1, r * 0.5, r * 0.3, 0, 0, Math.PI * 2);
      cx.fill();
    });
    // 丘と地面
    cx.fillStyle = '#a6e6bf';
    cx.beginPath(); cx.ellipse(W * 0.3, GROUND + H * 0.03, W * 0.7, H * 0.09, 0, 0, Math.PI * 2); cx.fill();
    cx.fillStyle = LEAF; cx.fillRect(0, GROUND, W, H - GROUND);
    cx.fillStyle = LEAF_DARK; cx.fillRect(0, GROUND, W, 5);
  }

  function drawHangGrape(g) {
    var s = ease(g.grow);
    if (g.state !== 'hang' || g.delay > 0 || s <= 0) return;
    var px = g.fx * W, len = g.fy * H - S / 2 - LEAFB;
    cx.save();
    cx.translate(px, LEAFB);
    cx.rotate(Math.sin(t * 1.4 + g.i * 1.7) * 0.03);
    cx.scale(s, s);
    cx.strokeStyle = BROWN; cx.lineWidth = 5; cx.lineCap = 'round';
    cx.beginPath(); cx.moveTo(0, 0); cx.lineTo(0, len + 6); cx.stroke();
    drawGrape(imgHang, 0, len + S / 2, S);
    cx.restore();
  }

  function drawCanopy() {
    var r = Math.max(34, W * 0.085), x;
    cx.fillStyle = LEAF_DARK;
    cx.fillRect(0, 0, W, LEAFB - r * 0.35);
    for (x = -r * 0.3; x < W + r; x += r * 1.3) circle(x, LEAFB - r * 0.35, r, LEAF_DARK);
    for (x = r * 0.35; x < W + r; x += r * 1.3) circle(x, LEAFB - r * 0.75, r * 0.8, LEAF);
    cx.fillStyle = LEAF; cx.fillRect(0, 0, W, LEAFB - r * 1.3);
  }

  var PILE = [
    [-1.2, 0], [-0.4, 0], [0.4, 0], [1.2, 0],
    [-0.8, -0.75], [0, -0.75], [0.8, -0.75],
    [-0.4, -1.45], [0.4, -1.45], [0, -2.1]
  ];
  function drawBasket() {
    var shown = fullTimer > 0 ? 10 : stock;
    cx.save();
    cx.translate(bx, BY + BH);
    cx.scale(1 + 0.07 * bump, 1 - 0.07 * bump);
    cx.translate(-bx, -(BY + BH));
    // 口の奥
    cx.fillStyle = BROWN;
    cx.beginPath(); cx.ellipse(bx, BY, BW / 2, BH * 0.1, 0, 0, Math.PI * 2); cx.fill();
    // 受け止めたブドウ
    var gs = BW * 0.3;
    for (var k = 0; k < shown; k++) {
      drawGrape(imgFall, bx + PILE[k][0] * gs, BY - gs * 0.05 + PILE[k][1] * gs, gs);
    }
    // カゴ本体
    cx.fillStyle = '#d9944a';
    cx.beginPath();
    cx.moveTo(bx - BW / 2, BY); cx.lineTo(bx + BW / 2, BY);
    cx.lineTo(bx + BW * 0.39, BY + BH); cx.lineTo(bx - BW * 0.39, BY + BH);
    cx.closePath(); cx.fill();
    cx.strokeStyle = '#b8742f'; cx.lineWidth = 3;
    for (var i = 1; i <= 2; i++) {
      var yy = BY + BH * i / 3, hw = BW * (0.5 - 0.11 * i / 3);
      cx.beginPath(); cx.moveTo(bx - hw, yy); cx.lineTo(bx + hw, yy); cx.stroke();
    }
    for (var j = -2; j <= 2; j++) {
      cx.beginPath(); cx.moveTo(bx + j * BW * 0.2, BY); cx.lineTo(bx + j * BW * 0.16, BY + BH); cx.stroke();
    }
    // ふち
    cx.fillStyle = '#c27f38';
    var rh = BH * 0.16, rx = bx - BW * 0.53, rw = BW * 1.06;
    cx.beginPath();
    if (cx.roundRect) cx.roundRect(rx, BY - rh / 2, rw, rh, rh / 2);
    else cx.rect(rx, BY - rh / 2, rw, rh);
    cx.fill();
    cx.restore();
  }

  function draw() {
    drawBackground();
    grapes.forEach(drawHangGrape);
    drawCanopy();
    // 落下中・地面のブドウ
    grapes.forEach(function (g) {
      if (g.state === 'fall') drawGrape(imgFall, g.x, g.y, S);
      else if (g.state === 'miss') {
        cx.globalAlpha = Math.max(0, 1 - g.fade);
        drawGrape(imgFall, g.x, g.y, S);
        cx.globalAlpha = 1;
      }
    });
    drawBasket();
    sparks.forEach(function (p) {
      cx.globalAlpha = Math.max(0, 1 - p.age / p.life);
      circle(p.x, p.y, p.r, p.col);
    });
    cx.globalAlpha = 1;
  }

  // ---- ループ ----
  var last = 0;
  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000 || 0);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }
  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(function (n) { last = n; frame(n); });
})();
</script>
</body>
</html>
