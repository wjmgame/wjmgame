<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="game-title" content="しんけいすいじゃく">
<meta name="game-icon" content="🃏">
<meta name="game-color" content="#8e7cff">
<meta name="game-order" content="4">
<title>しんけいすいじゃく</title>
<style>
  :root{
    --sky:#8fd3f4; --coral:#ff7a6b; --sun:#ffc83d; --leaf:#4ccb8a; --grape:#8e7cff; --ink:#23305a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--sky);color:var(--ink);
    font-family:-apple-system,"Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
    touch-action:manipulation;user-select:none;-webkit-user-select:none;}
  body{background:linear-gradient(#b9e6fb,#8fd3f4);}
  #top{position:absolute;left:0;right:0;top:0;height:calc(env(safe-area-inset-top,0px) + 56px);
    padding-top:env(safe-area-inset-top,0px);display:flex;align-items:center;justify-content:center;gap:10px;pointer-events:none;}
  .star{font-size:26px;filter:grayscale(1) opacity(.35);transition:.3s;}
  .star.on{filter:none;transform:scale(1.15);}
  #board{position:absolute;left:0;right:0;bottom:0;top:calc(env(safe-area-inset-top,0px) + 56px);
    padding:12px 12px calc(env(safe-area-inset-bottom,0px) + 12px);}
  .card{position:absolute;perspective:600px;cursor:pointer;}
  .inner{position:absolute;inset:0;transition:transform .35s;transform-style:preserve-3d;}
  .card.up .inner,.card.done .inner{transform:rotateY(180deg);}
  .face,.back{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;
    box-shadow:0 4px 0 rgba(35,48,90,.25);overflow:hidden;}
  .back{background:var(--grape);display:flex;align-items:center;justify-content:center;font-size:40px;color:#fff;
    background-image:radial-gradient(rgba(255,255,255,.25) 2px,transparent 2px);background-size:16px 16px;}
  .face{background:#fff;transform:rotateY(180deg);display:flex;align-items:center;justify-content:center;}
  .face img{width:86%;height:86%;object-fit:cover;border-radius:50%;pointer-events:none;}
  .face .dot{width:70%;height:70%;border-radius:50%;}
  .card.done .face{box-shadow:0 0 0 5px var(--sun),0 4px 0 rgba(35,48,90,.25);}
  .card.bounce .inner{animation:bounce .5s;}
  @keyframes bounce{0%,100%{transform:rotateY(180deg) scale(1);}50%{transform:rotateY(180deg) scale(1.12);}}
  .clear{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:10;pointer-events:none;
    font-size:min(24vw,140px);font-weight:900;letter-spacing:.05em;color:#fff;
    text-shadow:0 6px 0 var(--coral),0 0 24px rgba(255,200,61,.9);animation:clearin .7s cubic-bezier(.2,1.6,.4,1) both;}
  @keyframes clearin{0%{opacity:0;transform:scale(.2) rotate(-8deg);}100%{opacity:1;transform:scale(1) rotate(0);}}
  .fx{position:absolute;font-size:34px;pointer-events:none;animation:fly 1.1s ease-out forwards;z-index:5;}
  @keyframes fly{0%{opacity:1;transform:translate(0,0) scale(.5);}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.4);}}
</style>
</head>
<body>
<div id="top"></div>
<div id="board"></div>
<script src="../common.js"></script>
<script>
(function(){
  var START_PAIRS = 2;   // 最初のペア数
  var MAX_PAIRS = 10;    // 最大ペア数
  var FALLBACK = ['#ff7a6b','#ffc83d','#4ccb8a','#8e7cff','#5bb8f5','#ff9ec7','#a0d468','#ffa24d','#47d1c9','#c58cf0'];

  var board = document.getElementById('board');
  var top = document.getElementById('top');
  var faces = [];          // 画像URL
  var pairs = START_PAIRS;
  var cards = [];
  var opened = [];
  var locked = false;
  var matched = 0;
  var finished = false;

  function A(){ return window.Asobo || {}; }
  function safe(fn){ try{ fn(); }catch(e){} }
  function shuffle(a){
    for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
    return a;
  }

  // faces/list.json の読み込み(文字列配列/オブジェクト配列どちらでも対応)
  var FACE_MAX = 12;
  // 連番フォールバック: 1.jpg, 2.jpg… を順に確認
  function probeSequential(){
    return new Promise(function(resolve){
      var found = [];
      (function next(i){
        if(i > FACE_MAX){ resolve(found); return; }
        var im = new Image();
        im.onload = function(){ found.push('../faces/' + i + '.jpg'); next(i+1); };
        im.onerror = function(){ resolve(found); };
        im.src = '../faces/' + i + '.jpg';
      })(1);
    });
  }

  // faces/list.json = ファイル名だけの文字列配列。?t=時刻でsw.jsのキャッシュを回避
  function loadFaces(){
    return fetch('../faces/list.json?t=' + Date.now(),{cache:'no-store'}).then(function(r){
      if(!r.ok) throw new Error('no list');
      return r.json();
    }).then(function(arr){
      if(!Array.isArray(arr) || !arr.length) throw new Error('empty');
      faces = arr.slice(0, FACE_MAX).map(function(n){
        return '../faces/' + encodeURIComponent(n);
      });
    }).catch(function(){
      return probeSequential().then(function(found){ faces = found; });
    });
  }

  function maxPairsNow(){
    // 顔写真が足りない場合は色の丸で補う
    return MAX_PAIRS;
  }

  function buildDeck(n){
    var picks = [];
    var pool = shuffle(faces.slice());
    for(var i=0;i<n;i++){
      if(i < pool.length) picks.push({img:pool[i]});
      else picks.push({color:FALLBACK[(i - pool.length) % FALLBACK.length]});
    }
    var deck = [];
    picks.forEach(function(p,idx){
      deck.push({id:idx,p:p});
      deck.push({id:idx,p:p});
    });
    return shuffle(deck);
  }

  function renderStars(lit){
    if(lit === undefined) lit = pairs - START_PAIRS;
    top.innerHTML = '';
    for(var i=0;i<MAX_PAIRS-START_PAIRS+1;i++){
      var s = document.createElement('span');
      s.className = 'star' + (i < lit ? ' on' : '');
      s.textContent = '⭐';
      top.appendChild(s);
    }
  }

  function layout(count){
    var W = board.clientWidth - 24, H = board.clientHeight - 24;
    var best = null;
    for(var cols=1; cols<=count; cols++){
      var rows = Math.ceil(count/cols);
      var gap = 10;
      var w = (W - gap*(cols-1))/cols;
      var h = (H - gap*(rows-1))/rows;
      // カードの縦横比 3:4
      var cw = Math.min(w, h*0.75), ch = cw/0.75;
      if(!best || cw > best.cw) best = {cols:cols,rows:rows,cw:cw,ch:ch,gap:gap};
    }
    return best;
  }

  function startLevel(){
    board.innerHTML = '';
    opened = []; locked = false; matched = 0;
    renderStars();
    var deck = buildDeck(pairs);
    var L = layout(deck.length);
    var totalW = L.cols*L.cw + (L.cols-1)*L.gap;
    var totalH = L.rows*L.ch + (L.rows-1)*L.gap;
    var ox = 12 + ((board.clientWidth-24) - totalW)/2;
    var oy = 12 + ((board.clientHeight-24) - totalH)/2;
    cards = deck.map(function(d,i){
      var el = document.createElement('div');
      el.className = 'card';
      var c = i % L.cols, r = Math.floor(i / L.cols);
      // 最終行は中央寄せ
      var inRow = (r === L.rows-1) ? (deck.length - r*L.cols) : L.cols;
      var rowOffset = ((L.cols - inRow) * (L.cw + L.gap))/2;
      el.style.width = L.cw+'px'; el.style.height = L.ch+'px';
      el.style.left = (ox + c*(L.cw+L.gap) + rowOffset)+'px';
      el.style.top = (oy + r*(L.ch+L.gap))+'px';
      el.innerHTML = '<div class="inner"><div class="back">★</div><div class="face"></div></div>';
      var face = el.querySelector('.face');
      if(d.p.img){
        var im = document.createElement('img'); im.src = d.p.img; im.draggable = false; face.appendChild(im);
      } else {
        var dot = document.createElement('div'); dot.className='dot'; dot.style.background = d.p.color; face.appendChild(dot);
      }
      var card = {el:el,id:d.id,state:'down'};
      el.addEventListener('pointerdown', function(e){ e.preventDefault(); flip(card); });
      board.appendChild(el);
      return card;
    });
  }

  function flip(card){
    if(locked || card.state !== 'down') return;
    card.state = 'up';
    card.el.classList.add('up');
    safe(function(){ A().blip(opened.length); });
    opened.push(card);
    if(opened.length === 2) check();
  }

  function check(){
    locked = true;
    var a = opened[0], b = opened[1];
    if(a.id === b.id){
      setTimeout(function(){
        [a,b].forEach(function(c){
          c.state = 'done'; c.el.classList.remove('up'); c.el.classList.add('done','bounce');
        });
        safe(function(){ A().pop(); });
        burst(a.el); burst(b.el);
        matched++;
        opened = []; locked = false;
        if(matched === pairs) clear();
      }, 450);
    } else {
      setTimeout(function(){
        [a,b].forEach(function(c){ c.state='down'; c.el.classList.remove('up'); });
        opened = []; locked = false;
      }, 1000);
    }
  }

  function burst(el){
    var rect = el.getBoundingClientRect();
    var emo = ['✨','⭐','💖','🎈'];
    for(var i=0;i<4;i++){
      var f = document.createElement('div');
      f.className = 'fx';
      f.textContent = emo[Math.floor(Math.random()*emo.length)];
      f.style.left = (rect.left + rect.width/2 - 17)+'px';
      f.style.top = (rect.top + rect.height/2 - 17)+'px';
      f.style.setProperty('--dx', (Math.random()*160-80)+'px');
      f.style.setProperty('--dy', (Math.random()*160-110)+'px');
      document.body.appendChild(f);
      setTimeout(function(x){ return function(){ x.remove(); }; }(f), 1200);
    }
  }

  function clear(){
    locked = true;
    // ファンファーレ(ドミソド)
    [523,659,784,1047].forEach(function(f,i){
      setTimeout(function(){ safe(function(){ A().tone(f, 0.25, 0.2, 1); }); }, i*140);
    });
    cards.forEach(function(c,i){ setTimeout(function(){ burst(c.el); }, i*60); });
    // いまのステージの星を点灯
    renderStars(pairs - START_PAIRS + 1);
    if(pairs >= maxPairsNow()){
      finished = true;
      setTimeout(showClear, 900);
      setTimeout(function(){ location.href = '../'; }, 4500);
      return;
    }
    setTimeout(function(){
      pairs++;
      startLevel();
    }, 2200);
  }

  function showClear(){
    var el = document.createElement('div');
    el.className = 'clear';
    el.textContent = 'CLEAR';
    document.body.appendChild(el);
    safe(function(){ A().pop(); });
    for(var i=0;i<6;i++){
      setTimeout(function(){ burst(el); }, i*250);
    }
  }

  // どこをタップしても反応(カード以外をタップしたら小さな音)
  document.addEventListener('pointerdown', function(e){
    if(!e.target.closest('.card')) safe(function(){ A().blip(Math.floor(Math.random()*5)); });
  });

  window.addEventListener('resize', function(){ if(cards.length && !finished) { var keep = pairs; startLevel(); pairs = keep; } });

  loadFaces().then(startLevel);
})();
</script>
</body>
</html>
