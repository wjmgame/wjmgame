<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>モグラたたき</title>
<meta name="game-title" content="モグラたたき">
<meta name="game-icon" content="🔨">
<meta name="game-color" content="#4ccb8a">
<meta name="game-order" content="100">
<script src="../../shared/common.js"></script>
<script src="../../shared/faces.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #8fd3f4; color: #23305a;
    font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    user-select: none; -webkit-user-select: none;
    touch-action: manipulation;
  }
  #app {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    background: linear-gradient(#8fd3f4 0%, #8fd3f4 18%, #7fd37a 18%, #4ccb8a 100%);
  }
  #top {
    width: 100%; padding: 12px 76px 0 16px;
    display: flex; align-items: center; gap: 14px; height: 64px;
  }
  #score {
    font-size: 34px; font-weight: 800; min-width: 96px;
    background: #fff; border-radius: 999px; padding: 2px 16px; text-align: center;
  }
  #timer { flex: 1; height: 22px; background: rgba(255,255,255,.7); border-radius: 999px; overflow: hidden; }
  #bar { height: 100%; width: 100%; background: #ff7a6b; border-radius: 999px; }
  #boardwrap { flex: 1; width: 100%; display: flex; align-items: center; justify-content: center; min-height: 0; }
  #board {
    width: min(94vw, 78vh, 640px); aspect-ratio: 1;
    display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
    gap: 2%;
  }
  .cell { position: relative; }
  .hole {
    position: absolute; left: 6%; right: 6%; bottom: 10%; height: 26%;
    background: #5b3a29; border-radius: 50%;
    box-shadow: inset 0 -6px 0 rgba(0,0,0,.25);
  }
  .clip { position: absolute; left: 0; right: 0; top: 0; bottom: 23%; overflow: hidden; }
  .mole {
    position: absolute; left: 11%; width: 78%; bottom: 0; aspect-ratio: 1;
    border-radius: 50%; object-fit: cover; background: #fff;
    border: 4px solid #8a5a3c; font-size: 0;
    transform: translateY(110%); transition: transform .18s ease-out;
    display: flex; align-items: center; justify-content: center;
  }
  .mole.emoji { font-size: min(14vw, 11vh); background: #c89b6d; }
  .cell.up .mole { transform: translateY(0); }
  .cell.hit .mole { transition: none; animation: whack .35s ease-in forwards; }
  @keyframes whack {
    0% { transform: translateY(0) scale(1.15, .8); }
    100% { transform: translateY(110%) scale(1, 1); }
  }
  .star {
    position: absolute; left: 50%; top: 10%; font-size: min(10vw, 8vh);
    transform: translateX(-50%); opacity: 0; pointer-events: none;
  }
  .cell.hit .star { animation: starup .6s ease-out forwards; }
  @keyframes starup {
    0% { opacity: 1; transform: translate(-50%, 0) scale(.6); }
    100% { opacity: 0; transform: translate(-50%, -50px) scale(1.3); }
  }
  .ripple {
    position: fixed; width: 36px; height: 36px; margin: -18px 0 0 -18px;
    border-radius: 50%; border: 4px solid rgba(255,255,255,.9);
    pointer-events: none; animation: rip .4s ease-out forwards; z-index: 5;
  }
  @keyframes rip { from { transform: scale(.3); opacity: 1; } to { transform: scale(1.8); opacity: 0; } }
  #overlay {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    background: rgba(35, 48, 90, .55); color: #fff; text-align: center;
  }
  #overlay.hidden { display: none; }
  #ov-icon { font-size: min(30vw, 22vh); line-height: 1; }
  #ov-score { font-size: min(24vw, 18vh); font-weight: 800; line-height: 1; }
  #ov-play {
    font-size: min(16vw, 12vh); line-height: 1;
    background: #ffc83d; color: #23305a; border-radius: 50%;
    width: 1.5em; height: 1.5em; display: flex; align-items: center; justify-content: center;
  }
  #panel {
    position: fixed; inset: 0; z-index: 20; display: none;
    align-items: center; justify-content: center;
    background: rgba(35, 48, 90, .6);
  }
  #panel.open { display: flex; }
  #panel .box {
    background: #fff; border-radius: 20px; padding: 20px 22px; width: min(88vw, 380px);
    display: flex; flex-direction: column; gap: 14px;
  }
  #panel h2 { margin: 0; font-size: 20px; text-align: center; }
  #panel label { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 17px; font-weight: 700; }
  #panel select { font-size: 17px; padding: 8px 10px; border-radius: 10px; border: 2px solid #8fd3f4; background: #fff; color: #23305a; }
  #panel button {
    font-size: 20px; font-weight: 800; padding: 12px; border: 0; border-radius: 14px;
    background: #ffc83d; color: #23305a;
  }
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div id="score">0</div>
    <div id="timer"><div id="bar"></div></div>
  </div>
  <div id="boardwrap"><div id="board"></div></div>
</div>
<div id="overlay">
  <div id="ov-icon">🔨</div>
  <div id="ov-score" style="display:none"></div>
  <div id="ov-play">▶</div>
</div>

<div id="panel">
  <div class="box">
    <h2>むずかしさ</h2>
    <label>せいげんじかん
      <select id="s-time">
        <option value="10">10びょう</option>
        <option value="15">15びょう</option>
        <option value="20">20びょう</option>
        <option value="30">30びょう</option>
        <option value="60">60びょう</option>
      </select>
    </label>
    <label>でるはやさ
      <select id="s-spawn">
        <option value="500">はやい</option>
        <option value="800">ふつう</option>
        <option value="1200">ゆっくり</option>
      </select>
    </label>
    <label>かおをだすじかん
      <select id="s-stay">
        <option value="900">みじかい</option>
        <option value="1500">ふつう</option>
        <option value="2200">ながい</option>
      </select>
    </label>
    <label>どうじにでるかず
      <select id="s-max">
        <option value="1">1ぴき</option>
        <option value="2">2ひき</option>
        <option value="3">3びき</option>
      </select>
    </label>
    <button id="p-close">とじる</button>
  </div>
</div>

<script>
(function () {
  // ---- 調整用の定数 ----
  // 既定値。設定パネル(左上の⚙️を長押し)で変更でき、この端末に保存される
  var DEFAULTS = { sec: 15, spawn: 800, stay: 1500, max: 2 };
  var cfg = loadCfg();
  var MAX_FACES = 40;     // 読み込む顔写真の最大枚数
  var OVER_LOCK_MS = 1200; // 終了直後の誤タップ防止
  var KEY = 'mogura_settings';

  function loadCfg() {
    var c = { sec: DEFAULTS.sec, spawn: DEFAULTS.spawn, stay: DEFAULTS.stay, max: DEFAULTS.max };
    try {
      var v = JSON.parse(localStorage.getItem('mogura_settings') || '{}');
      for (var k in c) if (typeof v[k] === 'number' && isFinite(v[k])) c[k] = v[k];
    } catch (e) {}
    return c;
  }
  function saveCfg() {
    try { localStorage.setItem(KEY, JSON.stringify(cfg)); } catch (e) {}
  }

  var board = document.getElementById('board');
  var scoreEl = document.getElementById('score');
  var bar = document.getElementById('bar');
  var overlay = document.getElementById('overlay');
  var ovIcon = document.getElementById('ov-icon');
  var ovScore = document.getElementById('ov-score');

  var faces = [];
  var cells = [];
  var phase = 'ready'; // ready / play / over
  var score = 0, startAt = 0, lastSpawn = 0, lockUntil = 0;

  function safe(fn) { try { fn(); } catch (e) {} }

  // ---- 盤面は1回だけ作る(resizeでは作り直さない) ----
  for (var i = 0; i < 9; i++) {
    var el = document.createElement('div');
    el.className = 'cell';
    el.innerHTML = '<div class="hole"></div><div class="clip"></div><div class="star">⭐</div>';
    var mole = document.createElement('img');
    mole.className = 'mole';
    mole.alt = '';
    mole.draggable = false;
    el.querySelector('.clip').appendChild(mole);
    board.appendChild(el);
    cells.push({ el: el, mole: mole, up: false, timer: 0 });
  }

  function loadFaces() {
    return Promise.resolve(Asobo.faces.urls(MAX_FACES)).then(function (urls) {
      faces = (urls || []).slice();
      faces.forEach(function (u) { var im = new Image(); im.src = u; });
    }).catch(function () { faces = []; });
  }

  function setFace(c) {
    var m = c.mole;
    if (faces.length) {
      m.className = 'mole';
      m.src = faces[Math.floor(Math.random() * faces.length)];
    } else {
      // 顔写真が無いとき(ローカル確認用)の代わり
      m.className = 'mole emoji';
      m.removeAttribute('src');
      m.textContent = '🐹';
    }
  }

  function hide(c) {
    c.up = false;
    clearTimeout(c.timer);
    c.el.classList.remove('up');
  }

  function spawn() {
    var up = cells.filter(function (c) { return c.up; }).length;
    if (up >= cfg.max) return;
    var free = cells.filter(function (c) { return !c.up && !c.el.classList.contains('hit'); });
    if (!free.length) return;
    var c = free[Math.floor(Math.random() * free.length)];
    setFace(c);
    c.up = true;
    // 次のフレームで出して、アニメーションを確実に動かす
    requestAnimationFrame(function () { c.el.classList.add('up'); });
    safe(function () { Asobo.blip(Math.floor(Math.random() * 5)); });
    c.timer = setTimeout(function () { hide(c); }, cfg.stay * (0.8 + Math.random() * 0.4));
  }

  function hit(c) {
    hide(c);
    score++;
    scoreEl.textContent = score;
    c.el.classList.remove('hit');
    void c.el.offsetWidth;
    c.el.classList.add('hit');
    setTimeout(function () { c.el.classList.remove('hit'); }, 400);
    safe(function () { Asobo.pop(); });
  }

  function ripple(x, y) {
    var r = document.createElement('div');
    r.className = 'ripple';
    r.style.left = x + 'px';
    r.style.top = y + 'px';
    document.body.appendChild(r);
    setTimeout(function () { r.remove(); }, 450);
  }

  function start() {
    score = 0;
    scoreEl.textContent = '0';
    cells.forEach(hide);
    overlay.classList.add('hidden');
    phase = 'play';
    startAt = performance.now();
    lastSpawn = startAt - cfg.spawn; // すぐ最初のモグラを出す
    requestAnimationFrame(loop);
  }

  function finish() {
    phase = 'over';
    cells.forEach(hide);
    bar.style.width = '0%';
    ovIcon.textContent = score > 0 ? '🎉' : '🔨';
    ovScore.textContent = score;
    ovScore.style.display = '';
    overlay.classList.remove('hidden');
    lockUntil = performance.now() + OVER_LOCK_MS;
    var notes = [523, 659, 784, 1047];
    notes.forEach(function (f, i) {
      setTimeout(function () { safe(function () { Asobo.tone(f, 0.18, 0.18, 1); }); }, i * 140);
    });
  }

  function loop(now) {
    if (phase !== 'play') return;
    var elapsed = (now - startAt) / 1000;
    var left = Math.max(0, cfg.sec - elapsed);
    bar.style.width = (left / cfg.sec * 100) + '%';
    if (left <= 0) { finish(); return; }
    if (now - lastSpawn >= cfg.spawn) { lastSpawn = now; spawn(); }
    requestAnimationFrame(loop);
  }

  // ---- 入力(マルチタッチ対応: pointerdown を個別に処理) ----
  document.addEventListener('pointerdown', function (e) {
    if (panel.classList.contains('open')) return;
    // 左上・右上の隅のボタン(長押し用)の操作では、ゲームを始めない
    if (e.clientY < 90 && (e.clientX < 80 || e.clientX > window.innerWidth - 80)) return;
    if (phase === 'ready') { start(); return; }
    if (phase === 'over') { if (performance.now() >= lockUntil) start(); return; }
    var cellEl = e.target.closest ? e.target.closest('.cell') : null;
    var c = null;
    if (cellEl) {
      for (var i = 0; i < cells.length; i++) if (cells[i].el === cellEl) c = cells[i];
    }
    if (c && c.up) { hit(c); }
    else { ripple(e.clientX, e.clientY); }
  });

  // iOS のダブルタップ拡大などを防ぐ
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });

  // ---- 設定パネル ----
  var panel = document.getElementById('panel');
  var sels = {
    sec: document.getElementById('s-time'),
    spawn: document.getElementById('s-spawn'),
    stay: document.getElementById('s-stay'),
    max: document.getElementById('s-max')
  };
  function fillPanel() {
    for (var k in sels) sels[k].value = String(cfg[k]);
  }
  Object.keys(sels).forEach(function (k) {
    sels[k].addEventListener('change', function () {
      cfg[k] = Number(sels[k].value);
      saveCfg();
    });
  });
  function openPanel() {
    // あそんでいる最中に開いたら、中断して最初の画面に戻す
    if (phase === 'play') {
      phase = 'ready';
      cells.forEach(hide);
      bar.style.width = '100%';
      ovIcon.textContent = '🔨';
      ovScore.style.display = 'none';
      overlay.classList.remove('hidden');
    }
    fillPanel();
    panel.classList.add('open');
  }
  document.getElementById('p-close').addEventListener('click', function () {
    panel.classList.remove('open');
  });
  panel.addEventListener('pointerdown', function (e) { e.stopPropagation(); });

  safe(function () {
    Asobo.cornerButton({ corner: 'left', icon: '⚙️', label: '設定（長押し）', onHold: openPanel });
  });

  loadFaces();
})();
</script>
</body>
</html>
